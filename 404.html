<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Amazon Clone</title>
  <script>
    // Save the current path
    var path = window.location.pathname;
    // Redirect to home with the path as query param
    window.location.replace('/?p=' + encodeURIComponent(path));
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
